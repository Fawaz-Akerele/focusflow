
services:
  # Tier 3: Database (PostgreSQL)
  database:
    image: postgres:15-alpine
    container_name: focusflow_db
    restart: always
    environment:
      POSTGRES_DB: focusflow
      POSTGRES_USER: focus_user
      POSTGRES_PASSWORD: focus_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U focus_user -d focusflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Tier 2: Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: focusflow_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DB_HOST: database
      DB_USER: focus_user
      DB_PASSWORD: focus_password
      DB_NAME: focusflow
    depends_on:
      database:
        condition: service_healthy

  # Tier 1: Frontend UI
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: focusflow_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data: